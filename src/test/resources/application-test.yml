server:
  shutdown: immediate

aws:
  provider: localstack

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

api:
  base:
    url:
      oauth: http://localhost:8090/auth
      prison: http://localhost:8093
      prisoner-search: http://localhost:8094
      locations: http://localhost:8095
      case-notes: http://localhost:8096

spring:
  flyway:
    url: jdbc:postgresql://localhost:5432/incentives?sslmode=prefer
    user: incentives
    password: incentives

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/incentives
    username: incentives
    password: incentives
    properties:
      sslMode: DISABLE
      sslRootCert:

logging:
  level:
    io.r2dbc.postgresql.QUERY: DEBUG # for queries
    io.r2dbc.postgresql.PARAM: INFO # for parameters

hmpps.sqs:
  reactiveApi: true
  provider: localstack
  queues:
    audit:
      queueName: ${random.uuid}
    incentives:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: domainevents
      subscribeFilter: >-
        {"eventType": [
          "prison-offender-events.prisoner.merged",
          "prison-offender-events.prisoner.booking.moved",
          "prisoner-offender-search.prisoner.received",
          "prisoner-offender-search.prisoner.alerts-updated"
        ]}
    test:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: domainevents
      subscribeFilter: >-
        {"eventType": [
          {"prefix": "incentives."}
        ]}

  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:${random.uuid}

# The SAR test library's approval files. See SubjectAccessRequestLibraryTest for what each check guards.
hmpps.sar:
  tests:
    attachments-expected: false
    # Bump only after checking the new migration against what a prisoner's SAR report should contain, and telling
    # the Offender SAR team if it does. V1_35 adds column comments only.
    expected-flyway-schema-version: 1.35
    expected-api-response:
      path: /sar/expected-api-response.json
    expected-render-result:
      path: /sar/expected-render-result.html
